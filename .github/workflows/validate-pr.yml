name: validate-pr

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pull-request:
    name: Pull-request validation
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium OS deps
        run: npx playwright install --with-deps chromium

      - name: E2E Chromium (phone + desktop)
        run: npx playwright test --project=chromium --project=chromium-desktop
        env:
          CI: true

      - name: E2E Vite deep-link smoke
        run: npm run test:e2e:vite
        env:
          CI: true
